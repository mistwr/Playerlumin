<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#04060d"/>
<title>LUMIN AI PLAYER</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04060d;--bg2:#0b0f1c;--bg3:#111827;--bg4:#1a2236;--bdr:rgba(99,179,255,.10);--bdrg:rgba(99,179,255,.30);--acc:#3b9eff;--accs:rgba(59,158,255,.14);--t1:#e8f0ff;--t2:#7a90b8;--t3:#3a4d6b;--red:#ff4d6a;--grn:#22d3a0;--gold:#f5c842;--r:14px;--rs:8px;--sw:230px;--hh:54px}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Outfit',sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bdrg);border-radius:3px}
#gate{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 90% 80% at 50% 40%,#091b38,var(--bg) 70%)}
.g-orb{width:88px;height:88px;border-radius:50%;margin-bottom:20px;background:radial-gradient(circle at 34% 30%,#d0eaff,#3b9eff 42%,#0a46c0 82%);box-shadow:0 0 55px rgba(59,158,255,.7),0 0 110px rgba(59,158,255,.28);animation:orbP 2.6s ease-in-out infinite}
@keyframes orbP{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 85px rgba(59,158,255,.95),0 0 160px rgba(59,158,255,.48)}}
.g-title{font-size:28px;font-weight:900;letter-spacing:5px;background:linear-gradient(135deg,#fff,#b0d8ff 50%,#3b9eff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.g-sub{font-size:11px;color:var(--t2);letter-spacing:3px;margin-top:3px;margin-bottom:26px}
.g-dots{display:flex;gap:12px;margin-bottom:14px}
.g-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bdrg);transition:.2s}
.g-dot.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
.g-inp{width:180px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:40px;color:var(--t1);font-family:'Outfit',sans-serif;font-size:20px;letter-spacing:12px;text-align:center;outline:none;transition:.2s}
.g-inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.g-btn{margin-top:11px;padding:10px 36px;background:linear-gradient(135deg,#3b9eff,#1a6fd4);border:none;border-radius:40px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:'Outfit',sans-serif}
.g-err{color:var(--red);font-size:12px;margin-top:7px;min-height:16px}
#app{display:none;height:100%;flex-direction:row}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;height:100%;overflow:hidden;z-index:10;transition:transform .22s}
.sb-brand{padding:14px 14px 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sb-orb{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 34% 32%,#d0eaff,#3b9eff 42%,#0a46c0 82%);box-shadow:0 0 10px rgba(59,158,255,.44)}
.sb-name{font-size:12px;font-weight:900;letter-spacing:2px}
.sb-nav{flex:1;overflow-y:auto;padding:6px}
.nsl{font-size:9px;color:var(--t3);letter-spacing:1.8px;font-weight:700;padding:0 9px;margin:10px 0 3px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;transition:.13s;color:var(--t2);font-size:13px;font-weight:500;border:1px solid transparent;user-select:none}
.ni:hover{background:var(--bg4);color:var(--t1)}
.ni.on{background:var(--accs);color:var(--acc);border-color:rgba(59,158,255,.18)}
.ni-ic{font-size:15px;width:19px;text-align:center;flex-shrink:0}
.nb{margin-left:auto;background:var(--acc);color:#fff;border-radius:10px;font-size:9px;font-weight:700;padding:2px 5px;min-width:17px;text-align:center}
.sb-foot{padding:7px 6px;border-top:1px solid var(--bdr);flex-shrink:0}
.sb-acc{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);background:var(--bg3);cursor:pointer}
.av{width:27px;height:27px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.av-nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-tp{font-size:10px;color:var(--t2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:var(--bg2)}
.tb-menu{display:none;background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer;padding:4px;line-height:1}
.tb-ttl{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bdr);border-radius:30px;padding:6px 11px;flex:1;max-width:280px;transition:.14s}
.sbar:focus-within{border-color:var(--acc)}
.sbar input{background:none;border:none;color:var(--t1);font-family:'Outfit',sans-serif;font-size:12px;outline:none;flex:1;min-width:0}
.sbar input::placeholder{color:var(--t3)}
.content{flex:1;overflow-y:auto;padding:14px}
#gLoad{position:fixed;inset:0;z-index:1500;background:rgba(4,6,13,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.gl-spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(59,158,255,.2);border-top-color:var(--acc);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gl-txt{font-size:14px;color:var(--t2)}
.gl-bar{width:220px;height:4px;background:rgba(59,158,255,.15);border-radius:4px;overflow:hidden}
.gl-fill{height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.gl-sub{font-size:11px;color:var(--t3)}
.hero{border-radius:16px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0c2855,#091e40 40%,#04060d);border:1px solid var(--bdr)}
.h-bdg{font-size:9px;color:var(--acc);letter-spacing:2px;font-weight:700;margin-bottom:5px}
.h-ttl{font-size:18px;font-weight:800;margin-bottom:4px}
.h-sub{font-size:12px;color:var(--t2);margin-bottom:13px}
.h-btns{display:flex;gap:7px;flex-wrap:wrap}
.hbtn{padding:7px 15px;border-radius:30px;font-size:12px;font-weight:700;cursor:pointer;transition:.14s;border:none;font-family:'Outfit',sans-serif}
.hbtn.p{background:var(--acc);color:#fff}
.hbtn.s{background:rgba(255,255,255,.08);color:var(--t1);border:1px solid var(--bdr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:16px}
.sc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;text-align:center;transition:.14s;cursor:pointer}
.sc:hover{border-color:var(--bdrg);transform:translateY(-2px)}
.sc-ic{font-size:18px;margin-bottom:5px}
.sc-n{font-size:18px;font-weight:800;color:var(--acc)}
.sc-l{font-size:10px;color:var(--t2);margin-top:2px}
.sec{margin-bottom:18px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.sec-ttl{font-size:13px;font-weight:700}
.sec-more{font-size:11px;color:var(--acc);cursor:pointer;background:none;border:none;font-family:'Outfit',sans-serif}
.pills{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px;padding-bottom:3px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 12px;border-radius:30px;border:1px solid var(--bdr);background:var(--bg2);color:var(--t2);font-size:11px;cursor:pointer;transition:.12s;white-space:nowrap;flex-shrink:0;font-family:'Outfit',sans-serif}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
.cc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.cc:hover{border-color:var(--bdrg);transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.4)}
.cc-thumb{height:96px;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.cc-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0d1f42,#060e20)}
.cc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;z-index:1}
.cc-ico{font-size:30px;z-index:1;position:relative}
.live-b{position:absolute;top:5px;left:5px;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:1px;z-index:2;display:flex;align-items:center;gap:3px}
.ldot{width:4px;height:4px;border-radius:50%;background:#fff;animation:lb 1s ease-in-out infinite}
@keyframes lb{0%,100%{opacity:1}50%{opacity:.2}}
.cc-info{padding:8px;flex:1}
.cc-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-ct{font-size:10px;color:var(--t2)}
.cc-acts{display:flex;gap:5px;padding:6px 8px 8px}
.bpl{flex:1;padding:6px;background:var(--acc);border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif}
.bfv{width:28px;height:28px;border-radius:6px;border:1px solid var(--bdr);background:var(--bg3);color:var(--t2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bfv.on{color:var(--gold);border-color:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.mc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s}
.mc:hover{border-color:var(--bdrg);transform:scale(1.03)}
.mp{aspect-ratio:2/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;overflow:hidden}
.mp-bg{position:absolute;inset:0;background:linear-gradient(160deg,#0d1f42,#050c18)}
.mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.mp-ico{z-index:1;position:relative}
.mp-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 55%);z-index:2}
.mp-btn{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(59,158,255,.9);border:none;border-radius:16px;color:#fff;font-size:10px;font-weight:700;padding:4px 12px;cursor:pointer;opacity:0;transition:.14s;white-space:nowrap;font-family:'Outfit',sans-serif}
.mc:hover .mp-btn{opacity:1}
.mi{padding:7px}
.mi-ttl{font-size:11px;font-weight:700;margin-bottom:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi-mt{font-size:10px;color:var(--t2)}
.sset{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.sset-sec{font-size:9px;color:var(--t3);letter-spacing:1.5px;padding:11px 13px 4px;font-weight:700;text-transform:uppercase}
.sset-it{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:.12s}
.sset-it:last-child{border-bottom:none}
.sset-it:hover{background:var(--bg4)}
.sset-ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sset-lb{flex:1;font-size:13px;font-weight:500}
.sset-vl{font-size:11px;color:var(--t2)}
.hlist{display:flex;flex-direction:column;gap:7px}
.hi{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;transition:.12s}
.hi:hover{border-color:var(--bdrg);background:var(--bg4)}
.hi-th{width:38px;height:38px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hi-in{flex:1;min-width:0}
.hi-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-mt{font-size:10px;color:var(--t2)}
.empty{text-align:center;padding:44px 20px;color:var(--t2)}
.empty-ic{font-size:38px;margin-bottom:10px;opacity:.4}
.empty-tx{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--t1)}
.empty-sb{font-size:12px}
#sbo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9}
#player{position:fixed;inset:0;z-index:5000;background:#000;display:none;flex-direction:column}
#pvid{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:#000;display:none}
#pld{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(4,6,13,.9);backdrop-filter:blur(6px)}
#pld.off{display:none}
.p-spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(59,158,255,.2);border-top-color:var(--acc);animation:spin .75s linear infinite}
.p-ldnm{font-size:15px;font-weight:700;text-align:center;max-width:280px;padding:0 20px}
.p-ldsb{font-size:12px;color:var(--t2);text-align:center}
.p-lderr{font-size:12px;color:var(--red);text-align:center;max-width:260px;line-height:1.5;display:none}
.p-retry{margin-top:8px;padding:7px 20px;background:var(--acc);border:none;border-radius:20px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:none;font-family:'Outfit',sans-serif}
.pu-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:12px 15px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,.92),transparent);transition:opacity .3s}
.pu-bot{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:12px 15px 16px;background:linear-gradient(to top,rgba(0,0,0,.94),transparent);display:flex;flex-direction:column;gap:8px;transition:opacity .3s}
.p-hide .pu-top,.p-hide .pu-bot{opacity:0;pointer-events:none}
.p-back{width:33px;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.p-ttl{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-cat-txt{font-size:10px;color:rgba(255,255,255,.55)}
.p-live{background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:3px 6px;border-radius:4px;letter-spacing:1px;display:flex;align-items:center;gap:3px;flex-shrink:0}
.p-prog{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.p-prog-bg{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.2);border-radius:3px}
.p-prog-buf{position:absolute;left:0;height:3px;background:rgba(255,255,255,.15);border-radius:3px}
.p-prog-fill{position:absolute;left:0;height:3px;background:var(--acc);border-radius:3px;width:0%}
.p-prog-th{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;transform:translateX(-50%);left:0%;opacity:0;transition:opacity .18s}
.p-prog:hover .p-prog-th{opacity:1}
.p-btns{display:flex;align-items:center;gap:4px}
.pbtn{background:rgba(255,255,255,.07);border:none;color:rgba(255,255,255,.85);cursor:pointer;font-size:15px;padding:6px;transition:.12s;border-radius:7px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Outfit',sans-serif}
.pbtn:hover{color:#fff;background:rgba(255,255,255,.16)}
.pbtn.big{font-size:23px;padding:5px 8px}
.p-time{font-size:10px;color:rgba(255,255,255,.6);font-family:monospace;flex:1;text-align:center}
.p-vw{display:flex;align-items:center;gap:5px}
.pvol{-webkit-appearance:none;width:60px;height:3px;border-radius:3px;background:rgba(255,255,255,.3);outline:none;cursor:pointer}
.pvol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.ppanel{position:absolute;bottom:78px;right:14px;z-index:20;background:var(--bg2);border:1px solid var(--bdrg);border-radius:12px;padding:11px;min-width:160px;box-shadow:0 8px 28px rgba(0,0,0,.6);display:none}
.pp-title{font-size:9px;color:var(--t2);margin-bottom:8px;letter-spacing:1px;font-weight:700;text-transform:uppercase}
.pp-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:.12s;font-size:12px;color:var(--t2);font-weight:500}
.pp-item:hover{background:var(--bg4);color:var(--t1)}
.pp-item.on{color:var(--acc);background:var(--accs)}
#ptap{position:absolute;inset:0;z-index:7;cursor:pointer}
#toasts{position:fixed;bottom:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:250px}
.toast{background:var(--bg3);border:1px solid var(--bdrg);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--t1);display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .24s both}
@keyframes tin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-color:rgba(34,211,160,.4)}.toast.err{border-color:rgba(255,77,106,.4)}.toast.warn{border-color:rgba(245,200,66,.4)}
@media(max-width:768px){.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:10;transform:translateX(-100%)}.sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.55)}#sbo.v{display:block}.tb-menu{display:flex!important}.sbar{max-width:none}.content{padding:11px}.p-btns .p-vw{display:none}}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.cgrid{grid-template-columns:1fr 1fr}.mgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="gate">
  <div class="g-orb"></div>
  <div class="g-title">LUMIN AI</div>
  <div class="g-sub">PLAYER</div>
  <div class="g-dots"><div class="g-dot" id="gd0"></div><div class="g-dot" id="gd1"></div><div class="g-dot" id="gd2"></div><div class="g-dot" id="gd3"></div></div>
  <input class="g-inp" id="gInp" type="password" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="&#8226;&#8226;&#8226;&#8226;"/>
  <div id="gErr" class="g-err"></div>
  <button class="g-btn" id="gBtn">Entrar</button>
</div>
<div id="gLoad"><div class="gl-spin"></div><div class="gl-txt" id="glTxt">A carregar...</div><div class="gl-bar"><div class="gl-fill" id="glFill" style="width:0%"></div></div><div class="gl-sub" id="glSub"></div></div>
<div id="app">
  <div id="sbo"></div>
  <nav class="sidebar" id="sb">
    <div class="sb-brand"><div class="sb-orb"></div><div><div class="sb-name">LUMIN <span style="color:var(--acc)">AI</span></div><div style="font-size:9px;color:var(--t3)">PLAYER</div></div></div>
    <div class="sb-nav">
      <div class="nsl">Principal</div>
      <div class="ni on" id="ni-home"><span class="ni-ic">&#9635;</span>Inicio</div>
      <div class="ni" id="ni-tv"><span class="ni-ic">&#128250;</span>TV ao Vivo<span class="nb" id="nb-tv">0</span></div>
      <div class="nsl">VOD</div>
      <div class="ni" id="ni-mov"><span class="ni-ic">&#127909;</span>Filmes<span class="nb" id="nb-mv">0</span></div>
      <div class="ni" id="ni-ser"><span class="ni-ic">&#127871;</span>Series<span class="nb" id="nb-sr">0</span></div>
      <div class="nsl">Biblioteca</div>
      <div class="ni" id="ni-fav"><span class="ni-ic">&#11088;</span>Favoritos<span class="nb" id="nb-fv" style="display:none">0</span></div>
      <div class="ni" id="ni-his"><span class="ni-ic">&#128336;</span>Historico</div>
      <div class="nsl">Sistema</div>

// ═══ ESTADO ═══

function G(id){return document.getElementById(id);}
function eH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s){if(!s||isNaN(s))return'--:--';var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=Math.floor(s%60);return h?(h+':'+p2(m)+':'+p2(sc)):(p2(m)+':'+p2(sc));}
function p2(n){return String(n).padStart(2,'0');}
function lsG(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsR(k){try{localStorage.removeItem(k);}catch(e){}}
function toast(msg,type){var c=G('toasts'),d=document.createElement('div');d.className='toast'+(type?' '+type:'');d.innerHTML='<span>'+(type==='ok'?'&#10003;':type==='err'?'&#10005;':'&#9432;')+'</span><span style="flex:1">'+eH(msg)+'</span>';c.appendChild(d);setTimeout(function(){d.style.cssText='opacity:0;transform:translateX(10px);transition:.22s';setTimeout(function(){d.remove();},230);},3200);}
function showLoad(show,txt,pct,sub){G('gLoad').style.display=show?'flex':'none';if(txt)G('glTxt').textContent=txt;if(pct!==undefined)G('glFill').style.width=pct+'%';if(sub!==undefined)G('glSub').textContent=sub;}

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded',function(){

  G('pBS').addEventListener('click',function(){togP('spd');});
  G('pFS').addEventListener('click',function(){var p=G('player');if(document.fullscreenElement)document.exitFullscreen().catch(function(){});else p.requestFullscreen().catch(function(){});});
  G('pRetry').addEventListener('click',function(){if(CUR)startPlay(CUR);});
  G('ptap').addEventListener('click',function(){showCtrl();closeAllP();});
  G('ptap').addEventListener('dblclick',function(){var p=G('player');if(document.fullscreenElement)document.exitFullscreen().catch(function(){});else p.requestFullscreen().catch(function(){});});

// ═══ GATE ═══
function doGate(){
  var v=G('gInp').value;
  if(v==='2026'){
    G('gErr').textContent='';
    G('gate').style.display='none';
    G('app').style.display='flex';
    loadAll();
  } else if(v.length===4){
    G('gErr').textContent='Codigo incorreto';
    G('gInp').value='';
    for(var i=0;i<4;i++)G('gd'+i).classList.remove('on');
    setTimeout(function(){G('gErr').textContent='';},2000);
  }
}

// ═══ CARREGAR TUDO DO XTREAM ═══
async function loadAll(){
  if(LOADED)return;
  showLoad(true,'A ligar ao servidor...',10,'');
  var urls=[
    SRV+'/get.php?username='+encodeURIComponent(USR)+'&password='+encodeURIComponent(PWD)+'&type=m3u_plus&output=ts',
    SRV+'/get.php?username='+encodeURIComponent(USR)+'&password='+encodeURIComponent(PWD)+'&type=m3u_plus',
    SRV+'/get.php?username='+encodeURIComponent(USR)+'&password='+encodeURIComponent(PWD)+'&type=m3u'
  ];
  var txt=null;
  for(var i=0;i<urls.length;i++){
    showLoad(true,'A carregar playlist...',20+i*20,'Tentativa '+(i+1)+'/3');
    try{txt=await fetchTxt(urls[i]);if(txt&&txt.indexOf('#EXTINF')>=0)break;}catch(ex){console.warn(ex.message);}
  }
  if(txt&&txt.indexOf('#EXTINF')>=0){
    showLoad(true,'A processar...',85,'');
    parseM3U(txt);
    LOADED=true;
    toast(CH.length+' canais, '+MOV.length+' filmes, '+SER.length+' series','ok');
  } else {
    toast('Erro ao carregar. Verifica a ligacao.','err');
  }
  showLoad(false);
  updateBadges();
  renderSec();
}

function parseM3U(txt){
  CH=[];MOV=[];SER=[];
  var lines=txt.split('\n'),cur={},idx=0;
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(l.indexOf('#EXTINF')===0){
      cur={};
      var nm=l.match(/,(.+)$/);if(nm)cur.name=nm[1].trim();
      var grp=l.match(/group-title="([^"]*)"/i);if(grp)cur.cat=grp[1].trim();
      var logo=l.match(/tvg-logo="([^"]*)"/i);if(logo&&logo[1]&&logo[1].indexOf('http')===0)cur.ico=logo[1].trim();
    } else if(l.length>5&&l.charAt(0)!=='#'){
      cur.url=l.trim();
      cur.id=++idx;
      cur.name=cur.name||('Item '+idx);
      cur.cat=cur.cat||'Geral';
      cur.ico=cur.ico||'';
      var g=cur.cat.toLowerCase(),u=cur.url.toLowerCase();
      if(u.indexOf('/movie/')>=0||g.indexOf('movie')>=0||g.indexOf('filme')>=0||g.indexOf('vod')>=0||g.indexOf('novidade')>=0||g.indexOf('cinema')>=0){
        cur._t='mov';MOV.push(JSON.parse(JSON.stringify(cur)));
      } else if(u.indexOf('/series/')>=0||g.indexOf('serie')>=0||g.indexOf('season')>=0||g.indexOf('temp')>=0){
        cur._t='ser';SER.push(JSON.parse(JSON.stringify(cur)));
      } else {
        cur._t='ch';CH.push(JSON.parse(JSON.stringify(cur)));
      }
      cur={};
    }
  }
}

async function fetchTxt(url){
  var ctrl=new AbortController(),tid=setTimeout(function(){ctrl.abort();},25000);
  try{var r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});clearTimeout(tid);if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
  catch(e){clearTimeout(tid);throw e;}
}

function updateBadges(){
  var tv=G('nb-tv');if(tv)tv.textContent=CH.length;

}

function renderSec(){

  return h;

function rTV(){
  var cats=['Todos'],i;
  for(i=0;i<CH.length;i++){if(CH[i].cat&&cats.indexOf(CH[i].cat)<0)cats.push(CH[i].cat);}
  var list=CH.filter(function(c){return(CATF==='Todos'||c.cat===CATF)&&(!Q||c.name.toLowerCase().indexOf(Q.toLowerCase())>=0);});
  return mkPills(cats,'catF',CATF)+(list.length?'<div class="cgrid">'+list.map(cC).join('')+'</div>':emptyS('&#128250;','Sem canais',''));

function rMov(){
  var cats=['Todos'],i;
  for(i=0;i<MOV.length;i++){if(MOV[i].cat&&cats.indexOf(MOV[i].cat)<0)cats.push(MOV[i].cat);}

  return mkPills(cats,'genF',GENF)+(list.length?'<div class="mgrid">'+list.map(mC).join('')+'</div>':emptyS('&#127909;','Sem filmes',''));
}

function rSer(){
  var cats=['Todos'],i;
  for(i=0;i<SER.length;i++){if(SER[i].cat&&cats.indexOf(SER[i].cat)<0)cats.push(SER[i].cat);}
  var list=SER.filter(function(s){return(SERF==='Todos'||s.cat===SERF)&&(!Q||s.name.toLowerCase().indexOf(Q.toLowerCase())>=0);});
  return mkPills(cats,'serF',SERF)+(list.length?'<div class="cgrid">'+list.map(sC).join('')+'</div>':emptyS('&#127871;','Sem series',''));

function rFav(){
  var fc=CH.filter(function(c){return FAVS.indexOf(c.id)>=0;});

  return '<div class="mc" data-play="'+m.id+'" data-type="mov"><div class="mp"><div class="mp-bg"></div>'+img+
    '<div class="mp-ico">'+icoFor(m)+'</div><div class="mp-ov"></div>'+
    '<button class="mp-btn" data-play="'+m.id+'" data-type="mov">&#9654; Ver</button></div>'+
    '<div class="mi"><div class="mi-ttl" title="'+eH(m.name)+'">'+eH(m.name)+'</div><div class="mi-mt">'+eH(m.cat||'')+'</div></div></div>';
}

function sC(s){
  return '<div class="cc"><div class="cc-thumb"><div class="cc-bg"></div><div class="cc-ico">&#127871;</div></div>'+
    '<div class="cc-info"><div class="cc-nm" title="'+eH(s.name)+'">'+eH(s.name)+'</div><div class="cc-ct">'+eH(s.cat||'')+'</div></div>'+
    '<div class="cc-acts"><button class="bpl" data-play="'+s.id+'" data-type="ser">&#9654; Ver</button></div></div>';
}

function mkPills(cats,field,cur){
  var h='<div class="pills">';
  for(var i=0;i<Math.min(cats.length,30);i++)h+='<button class="pill'+(cur===cats[i]?' on':'')+'" data-pill="'+eH(cats[i])+'" data-field="'+field+'">'+eH(cats[i])+'</button>';
  return h+'</div>';
}

function emptyS(ic,tx,sb){return '<div class="empty"><div class="empty-ic">'+ic+'</div><div class="empty-tx">'+tx+'</div><div class="empty-sb">'+sb+'</div></div>';}

function icoFor(it){
  var n=String(it.name||it.cat||'').toLowerCase();
  if(n.indexOf('sport')>=0||n.indexOf('futebol')>=0||n.indexOf('benfica')>=0)return'&#9917;';
  if(n.indexOf('news')>=0||n.indexOf('notic')>=0||n.indexOf('cnn')>=0)return'&#128240;';
  if(n.indexOf('music')>=0||n.indexOf('mtv')>=0)return'&#127925;';
  if(n.indexOf('kids')>=0||n.indexOf('infant')>=0||n.indexOf('panda')>=0||n.indexOf('cartoon')>=0)return'&#129490;';
  if(n.indexOf('doc')>=0||n.indexOf('nat geo')>=0||n.indexOf('discovery')>=0||n.indexOf('history')>=0)return'&#128301;';
  if(n.indexOf('movie')>=0||n.indexOf('film')>=0||n.indexOf('cine')>=0)return'&#127909;';
  return'&#128250;';
}

// ═══ BIND EVENTS ═══
function bindEvents(){
  var bpls=document.querySelectorAll('[data-play]');
  for(var i=0;i<bpls.length;i++){(function(el){el.addEventListener('click',function(){playItem(parseInt(el.getAttribute('data-play')),el.getAttribute('data-type'));});})(bpls[i]);}
  var bfvs=document.querySelectorAll('[data-fav]');
  for(var i=0;i<bfvs.length;i++){(function(el){el.addEventListener('click',function(e){e.stopPropagation();togFav(parseInt(el.getAttribute('data-fav')),el);});})(bfvs[i]);}
  var navBtns=document.querySelectorAll('[data-nav]');
  for(var i=0;i<navBtns.length;i++){(function(el){el.addEventListener('click',function(){nav(el.getAttribute('data-nav'));});})(navBtns[i]);}
  var pills=document.querySelectorAll('[data-pill]');
  for(var i=0;i<pills.length;i++){(function(el){el.addEventListener('click',function(){var f=el.getAttribute('data-field'),v=el.getAttribute('data-pill');if(f==='catF')CATF=v;else if(f==='genF')GENF=v;else if(f==='serF')SERF=v;renderSec();});})(pills[i]);}
  var his=document.querySelectorAll('[data-hist]');
  for(var i=0;i<his.length;i++){(function(el){el.addEventListener('click',function(){var it=HIST[parseInt(el.getAttribute('data-hist'))];if(it&&it.url)startPlay(it);});})(his[i]);}
  var clr=G('clrHisBtn');if(clr)clr.addEventListener('click',function(){HIST=[];lsR('lh');renderSec();toast('Historico limpo','ok');});
  var clr2=G('clrHisBtn2');if(clr2)clr2.addEventListener('click',function(){HIST=[];lsR('lh');renderSec();toast('Historico limpo','ok');});
  var wipe=G('wipeBtn');if(wipe)wipe.addEventListener('click',function(){if(confirm('Apagar tudo?')){try{localStorage.clear();}catch(e){}FAVS=[];HIST=[];toast('Dados apagados','ok');renderSec();}});
  var rl=G('reloadBtn');if(rl)rl.addEventListener('click',function(){LOADED=false;CH=[];MOV=[];SER=[];loadAll();});
}

// ═══ PLAY ═══
function playItem(id,type){
  var arr=type==='ch'?CH:type==='mov'?MOV:SER;
  var item=null;for(var i=0;i<arr.length;i++){if(arr[i].id===id){item=arr[i];break;}}
  if(!item||!item.url){toast('URL nao disponivel','err');return;}
  startPlay(item);
}

function startPlay(item){
  CUR=item;
  addHist(item);
  G('player').style.display='flex';document.body.style.overflow='hidden';
  G('pTtl').textContent=item.name;
  G('pCatTxt').textContent=item.cat||'';
  G('pLive').style.display=item._t==='ch'?'flex':'none';
  G('pLdNm').textContent=item.name;G('pLdSb').textContent='A ligar...';
  G('pLdErr').style.display='none';G('pLdErr').textContent='';G('pRetry').style.display='none';
  G('pld').classList.remove('off');
  G('pFill').style.width='0%';G('pBuf').style.width='0%';G('pTime').textContent='--:-- / --:--';
  G('pBQ').textContent='AUTO';G('pBS').textContent='1x';
  closeAllP();showCtrl();
  initStream(item);
}

function initStream(item){
  var vid=G('pvid');
  if(HLS){HLS.destroy();HLS=null;}
  vid.pause();vid.removeAttribute('src');vid.load();vid.style.display='block';
  var isLive=item._t==='ch';
  if(!isLive){
    // VOD — direto nativo
    vid.src=item.url;vid.volume=VOL/100;vid.muted=MUTED;vid.load();
    var done=false;
    var onR=function(){if(done)return;done=true;G('pld').classList.add('off');vid.play().catch(function(){});};
    vid.addEventListener('canplay',onR,{once:true});
    setTimeout(function(){if(!done){done=true;vid.removeEventListener('canplay',onR);G('pld').classList.add('off');vid.play().catch(function(){onErr('Nao foi possivel reproduzir.');});}},10000);
    return;
  }
  // LIVE — tenta HLS.js, depois nativo
  var url=item.url;
  var m3u8=url.replace(/\.ts(\?.*)?$/,'.m3u8$1');
  if(m3u8===url&&url.indexOf('.m3u8')<0)m3u8=url;
  tryLive([
    {url:m3u8,method:'native'},
    {url:url, method:'native'},
    {url:m3u8,method:'hls'},
    {url:url, method:'hls'}
  ],0);
}

function tryLive(arr,ai){
  if(ai>=arr.length){onErr('Canal indisponivel ou offline.');return;}
  var a=arr[ai];
  G('pLdSb').textContent='A tentar... ('+(ai+1)+'/'+arr.length+')';
  if(a.method==='hls'){
    if(typeof Hls==='undefined'||!Hls.isSupported()){tryLive(arr,ai+1);return;}
    var vid=G('pvid');
    if(HLS){HLS.destroy();HLS=null;}
    vid.pause();vid.removeAttribute('src');vid.load();
    var hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:8,fragLoadingTimeOut:10000,manifestLoadingTimeOut:8000,startLevel:-1});
    HLS=hls;var ok=false;
    hls.loadSource(a.url);hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED,function(e,d){ok=true;G('pld').classList.add('off');vid.style.display='block';vid.volume=VOL/100;vid.muted=MUTED;vid.play().catch(function(){});buildQual(d.levels);});
    hls.on(Hls.Events.ERROR,function(e,d){if(!d.fatal||ok)return;ok=true;hls.destroy();HLS=null;tryLive(arr,ai+1);});
  } else {
    var vid=G('pvid');
    if(HLS){HLS.destroy();HLS=null;}
    vid.pause();vid.removeAttribute('src');vid.load();
    vid.src=a.url;vid.volume=VOL/100;vid.muted=MUTED;vid.load();
    var ok=false;
    var s=function(){if(ok)return;ok=true;vid.removeEventListener('error',f);G('pld').classList.add('off');vid.play().catch(function(){});};
    var f=function(){if(ok)return;ok=true;vid.removeEventListener('canplay',s);tryLive(arr,ai+1);};
    vid.addEventListener('canplay',s,{once:true});
    vid.addEventListener('error',f,{once:true});
    setTimeout(function(){if(!ok){ok=true;vid.removeEventListener('canplay',s);vid.removeEventListener('error',f);tryLive(arr,ai+1);}},4000);
  }
}

function onErr(msg){G('pld').classList.remove('off');G('pLdNm').textContent=CUR?CUR.name:'';G('pLdSb').textContent='';G('pLdErr').textContent=msg;G('pLdErr').style.display='block';G('pRetry').style.display='inline-block';G('pvid').style.display='none';}
function buildQual(lvs){if(!lvs||!lvs.length){G('qualList').innerHTML='<div class="pp-item on">Auto</div>';return;}var h='<div class="pp-item on" id="qa-1">Auto</div>';for(var i=0;i<lvs.length;i++){var l=lvs[i].height?lvs[i].height+'p':(lvs[i].bitrate?Math.round(lvs[i].bitrate/1000)+'k':'L'+i);h+='<div class="pp-item" id="qa'+i+'">'+l+'</div>';}G('qualList').innerHTML=h;var qs=G('qualList').querySelectorAll('.pp-item');for(var i=0;i<qs.length;i++){(function(el,idx){el.addEventListener('click',function(){if(!HLS)return;HLS.currentLevel=idx;var all=G('qualList').querySelectorAll('.pp-item');for(var j=0;j<all.length;j++)all[j].classList.remove('on');el.classList.add('on');G('pBQ').textContent=idx===-1?'AUTO':(HLS.levels[idx]&&HLS.levels[idx].height?HLS.levels[idx].height+'p':'Q'+idx);closeAllP();});})(qs[i],i-1);};}
function closePlayer(){var vid=G('pvid');vid.pause();vid.removeAttribute('src');vid.load();if(HLS){HLS.destroy();HLS=null;}try{if(document.pictureInPictureElement)document.exitPictureInPicture();}catch(e){}if(document.fullscreenElement)document.exitFullscreen().catch(function(){});G('player').style.display='none';document.body.style.overflow='';CUR=null;closeAllP();}
function showLD(){G('pld').classList.remove('off');}
function onTU(){var vid=G('pvid');if(!vid.duration||isNaN(vid.duration)||SCRUB)return;var p=(vid.currentTime/vid.duration)*100;G('pFill').style.width=p+'%';G('pTh').style.left=p+'%';G('pTime').textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);}
function onProg(){var vid=G('pvid');if(!vid.duration||!vid.buffered.length)return;try{G('pBuf').style.width=(vid.buffered.end(vid.buffered.length-1)/vid.duration*100)+'%';}catch(e){}}
function startScrub(cx){SCRUB=true;doScrub(cx);document.addEventListener('mousemove',onSM);document.addEventListener('mouseup',endScrub);document.addEventListener('touchmove',onST,{passive:true});document.addEventListener('touchend',endScrub);}
function onSM(e){doScrub(e.clientX);}function onST(e){doScrub(e.touches[0].clientX);}
function doScrub(cx){var rect=G('pProg').getBoundingClientRect();var p=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));G('pFill').style.width=p*100+'%';G('pFill').style.transition='none';G('pTh').style.left=p*100+'%';G('pTh').style.transition='none';SCRUBV=p;}
function endScrub(){if(!SCRUB)return;SCRUB=false;var vid=G('pvid');if(vid.duration&&!isNaN(vid.duration)){vid.currentTime=SCRUBV*vid.duration;G('pFill').style.transition='';G('pTh').style.transition='';}document.removeEventListener('mousemove',onSM);document.removeEventListener('mouseup',endScrub);document.removeEventListener('touchmove',onST);document.removeEventListener('touchend',endScrub);}
function togglePlay(){var vid=G('pvid');if(!vid.src)return;if(vid.paused){vid.play();G('pPlay').innerHTML='&#9208;';}else{vid.pause();G('pPlay').innerHTML='&#9654;';}}
function toggleMute(){MUTED=!MUTED;var vid=G('pvid');vid.muted=MUTED;G('pMute').innerHTML=MUTED?'&#128263;':'&#128266;';}
function setVol(v){VOL=+v;var vid=G('pvid');vid.volume=v/100;vid.muted=v==0;MUTED=v==0;G('pMute').innerHTML=v==0?'&#128263;':'&#128266;';}
function seekRel(s){var vid=G('pvid');if(!vid.duration||isNaN(vid.duration))return;vid.currentTime=Math.max(0,Math.min(vid.duration,vid.currentTime+s));}
function showCtrl(){G('player').classList.remove('p-hide');clearTimeout(CTMR);CTMR=setTimeout(function(){if(!G('pvid').paused)G('player').classList.add('p-hide');},4000);}
function togP(p){var pid='panel-'+p;var open=G(pid).style.display==='block';closeAllP();if(!open){if(p==='spd')buildSpd();G(pid).style.display='block';}showCtrl();}
function closeAllP(){for(var i=0;i<PANELS.length;i++)G(PANELS[i]).style.display='none';}
function buildSpd(){var cur=G('pvid').playbackRate||1;var h='';for(var i=0;i<SPEEDS.length;i++)h+='<div class="pp-item'+(SPEEDS[i]===cur?' on':'')+'" data-spd="'+SPEEDS[i]+'">'+SPEEDS[i]+'x</div>';G('spdList').innerHTML=h;var els=G('spdList').querySelectorAll('[data-spd]');for(var i=0;i<els.length;i++){(function(el){el.addEventListener('click',function(){var s=parseFloat(el.getAttribute('data-spd'));G('pvid').playbackRate=s;G('pBS').textContent=s+'x';var qs=G('spdList').querySelectorAll('[data-spd]');for(var j=0;j<qs.length;j++)qs[j].classList.remove('on');el.classList.add('on');closeAllP();});})(els[i]);}}
function onKey(e){if(G('player').style.display!=='flex')return;if(e.key===' '||e.key==='k'){e.preventDefault();togglePlay();}else if(e.key==='Escape')closePlayer();else if(e.key==='ArrowRight'){seekRel(10);showCtrl();}else if(e.key==='ArrowLeft'){seekRel(-10);showCtrl();}else if(e.key==='f')toggleFS();}
function addHist(it){var key=String(it.id);HIST=[it].concat(HIST.filter(function(h){return String(h.id)!==key;})).slice(0,40);try{lsS('lh',JSON.stringify(HIST));}catch(e){}}
function togFav(id,btn){var i=FAVS.indexOf(id);if(i>=0){FAVS.splice(i,1);if(btn){btn.classList.remove('on');btn.innerHTML='&#9734;';}toast('Removido dos favoritos');}else{FAVS.push(id);if(btn){btn.classList.add('on');btn.innerHTML='&#9733;';}toast('Adicionado','ok');}try{lsS('lf',JSON.stringify(FAVS));}catch(e){}updateBadges();}
</script>
